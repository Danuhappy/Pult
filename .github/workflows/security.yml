name: Проверка безопасности
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rls:
    name: Изоляция кабинетов в базе (RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Запустить атаки «чужой аккаунт» на настоящем PostgreSQL
        run: bash tests/run_rls_test.sh
  secrets:
    name: Поиск утёкших ключей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact --report-format json --report-path /repo/gitleaks.json
          code=$?
          python3 -c "import json;[print(f'::error file={f[\"File\"]},line={f[\"StartLine\"]}::gitleaks {f[\"RuleID\"]}') for f in json.load(open('gitleaks.json'))]" || true
          exit $code
      - name: Нет секретных ключей Supabase в публичных файлах
        run: |
          if grep -nE 'sb_secret_[A-Za-z0-9_-]{10,}' index.html app.js bank.js sw.js config.js style.css; then
            echo "Найден секретный ключ в публичном файле"; exit 1; fi
          python3 - <<'PY'
          import json,base64,re
          s=open('config.js').read()
          for t in re.findall(r'eyJ[\w-]+\.[\w-]+\.[\w-]+', s):
              p=t.split('.')[1]; p+='='*(-len(p)%4)
              role=json.loads(base64.urlsafe_b64decode(p)).get('role')
              assert role=='anon', f'В config.js ключ с ролью {role}, а нужен только anon'
          print('config.js: только публичный ключ')
          PY
  statements:
    name: Разбор банковских выписок
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CSV и Excel разных банков разбираются без потерь
        run: node tests/statements/check_tables.cjs
  push:
    name: Пуш-уведомления (шифрование и логика)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Шифрование Web Push и подпись VAPID
        run: node --experimental-strip-types --no-warnings tests/push/webpush.test.ts
      - name: Сверка с примером из стандарта RFC 8291 (независимая библиотека)
        run: |
          pip install --quiet cryptography
          node --experimental-strip-types --no-warnings tests/push/gen_for_python.ts | python3 tests/push/rfc_check.py
      - name: Какие напоминания и когда отправляются
        run: node --experimental-strip-types --no-warnings tests/push/reminders.test.ts
      - name: Функция целиком (подставной сервер)
        run: node --experimental-strip-types --no-warnings tests/push/function.test.ts

name: Публикация сайта
# Сайт обновляется ТОЛЬКО после успешной «Проверки безопасности» на ветке main.
on:
  workflow_run:
    workflows: ["Проверка безопасности"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Собрать только публичные файлы и выложить в ветку gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir _site
          cp index.html app.js style.css config.js icon.svg _site/
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Публикация ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
